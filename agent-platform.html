<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C-AI Platform · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand-50: oklch(94.64% .0196 270.2);
  --brand-100: oklch(83.58% .0626 269.9);
  --brand-300: oklch(64.53% .144 267.9);
  --brand-400: oklch(56.32% .1826 266.3);
  --brand-500: oklch(48.82% .2172 264.4);
  --brand-600: oklch(43.79% .1914 264.4);
  --brand-700: oklch(38.33% .1646 264.7);
  --dark-blue-500: oklch(27.39% .1076 264.8);
  --green-50: oklch(96.87% .0207 152.2);
  --green-500: oklch(62% .17 150);
  --green-700: oklch(48% .13 152);
  --red-50: oklch(95.63% .0218 14.1);
  --red-500: oklch(58% .21 25);
  --orange-500: oklch(75.33% .172 55.7);
  --text-primary: oklch(25.99% .0213 248.7);
  --text-secondary: oklch(46% .018 250);
  --text-muted: oklch(62% .015 250);
  --page-bg: oklch(96.02% .0034 247.9);
  --surface: #fff;
  --border: oklch(92% .004 250);
  --border-strong: oklch(87% .006 250);
  --radius: 12px;
  --radius-lg: 16px;
  --shadow-card: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.05);
  --sidebar-w: 264px;
  --sidebar-w-collapsed: 76px;
  --topbar-h: 72px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--page-bg); color:var(--text-primary);
  font-family:Inter,"Inter Fallback",system-ui,sans-serif;
  font-size:14px; -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input{font:inherit}
a{color:inherit;text-decoration:none}
.icon{width:20px;height:20px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icon-sm{width:16px;height:16px}

/* ---------- Topbar ---------- */
.topbar{
  position:fixed; inset:0 0 auto 0; height:var(--topbar-h); z-index:40;
  display:flex; align-items:center; gap:16px; padding:0 20px;
  background:var(--page-bg);
}
.hamburger{display:grid;place-items:center;width:40px;height:40px;border-radius:10px}
.hamburger:hover{background:rgba(16,24,40,.06)}
.logo{display:flex;align-items:center;gap:2px;font-weight:800;font-size:26px;letter-spacing:-.02em;
  background:var(--gradient, linear-gradient(135deg,#6888e5,#1d4ed8 50%,#153799));
  -webkit-background-clip:text;background-clip:text;color:transparent;padding-right:2px}
.logo .spark{color:var(--orange-500);font-size:14px;align-self:flex-start;margin-left:-2px}
.ws{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:10px}
.ws:hover{background:rgba(16,24,40,.05)}
.ws-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#6d28d9);color:#fff;
  display:grid;place-items:center;font-size:12px;font-weight:700}
.ws-name{font-weight:600;font-size:17px;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.global-search{
  flex:0 1 420px; margin-left:auto; margin-right:auto;
  display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;color:var(--text-muted);
  box-shadow:0 1px 2px rgba(16,24,40,.04);
}
.global-search input{flex:1;border:none;outline:none;background:none;font-size:14px;color:var(--text-primary)}
.kbd{font-size:11px;font-weight:600;color:var(--text-muted);background:oklch(94% .004 250);border-radius:6px;padding:3px 6px}
.topbar-right{display:flex;align-items:center;gap:14px;margin-left:auto}
.flag{width:26px;height:18px;border-radius:3px;background:#da251d;display:grid;place-items:center;color:#ff0;font-size:11px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#6888e5,#1d4ed8);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:13px}

/* ---------- Sidebar ---------- */
.sidebar{
  position:fixed; top:var(--topbar-h); bottom:0; left:0; width:var(--sidebar-w); z-index:30;
  display:flex; flex-direction:column; padding:8px 16px 0; transition:width .18s ease;
}
body.collapsed .sidebar{width:var(--sidebar-w-collapsed)}
.nav{flex:1;overflow-y:auto;padding-bottom:12px;scrollbar-width:thin}
.nav::-webkit-scrollbar{width:6px}
.nav::-webkit-scrollbar-thumb{background:oklch(88% .006 250);border-radius:3px}
.nav-group{margin-top:18px}
.nav-group-label{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--text-muted)
}
.nav-item{
  display:flex;align-items:center;gap:14px;height:44px;padding:0 12px;border-radius:10px;
  color:var(--text-primary);font-size:15px;font-weight:500;width:100%;text-align:left;
}
.nav-item:hover{background:rgba(16,24,40,.05)}
.nav-item.active{background:var(--brand-50);color:var(--brand-600);font-weight:600}
.nav-item.active .icon{stroke:var(--brand-600)}
body.collapsed .nav-item span, body.collapsed .nav-group-label, body.collapsed .collapse-btn span{display:none}
body.collapsed .nav-item{justify-content:center;padding:0}
.sidebar-footer{border-top:1px solid var(--border-strong);padding:14px 0 18px}
.collapse-btn{display:flex;align-items:center;gap:12px;color:var(--text-secondary);font-size:14px;padding:0 12px}

/* ---------- AI Chat UI (Trợ lý) ---------- */
.chat-app-wrap{display:flex;height:calc(100vh - var(--topbar-h) - 64px);min-height:560px;background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);overflow:hidden;position:relative}
.chat-sidebar{width:280px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--border);padding:18px 14px;display:flex;flex-direction:column;min-height:0}
.chat-sidebar-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:14px}
.chat-sidebar-titles{min-width:0}
.chat-sidebar-title{font-weight:700;font-size:15.5px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-sidebar-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.chat-search{display:flex;align-items:center;gap:8px;height:38px;background:oklch(96% .003 250);border:1px solid transparent;border-radius:999px;padding:0 14px;color:var(--text-muted);flex:0 0 auto;margin-bottom:8px}
.chat-search:focus-within{background:var(--surface);border-color:var(--border-strong)}
.chat-search input{border:none;outline:none;background:transparent;flex:1;color:var(--text-primary);font-size:13px}
.chat-new{flex:0 0 auto;display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px;border-radius:10px;background:var(--brand-50);color:var(--brand-600);font-weight:700;font-size:13.5px;margin:2px 0 6px}
.chat-new:hover{background:var(--brand-100)}
.chat-new-icon{display:grid;place-items:center;color:var(--brand-600)}
.chat-choose-agent{flex:0 0 auto;display:flex;align-items:center;gap:10px;width:100%;height:42px;padding:0 12px;border-radius:10px;background:transparent;color:var(--text-primary);font-weight:600;font-size:13.5px;margin-bottom:8px}
.chat-choose-agent:hover{background:oklch(96% .003 250)}
.chat-choose-agent-icon{display:grid;place-items:center;color:var(--text-muted)}
.chat-choose-agent span:nth-child(2){flex:1;text-align:left}
.chat-choose-agent .icon{color:var(--text-muted)}
.chat-thread-list{display:flex;flex-direction:column;gap:0;margin-top:2px;flex:1;overflow-y:auto;scrollbar-width:thin}
.chat-history-empty{padding:24px 8px;color:var(--text-muted);font-size:12.5px;text-align:center}
.chat-group-label{width:100%;display:flex;align-items:center;justify-content:space-between;padding:16px 10px 6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.chat-group-label:hover{color:var(--text-secondary)}
.chat-group-label .icon{width:14px;height:14px;transform:rotate(180deg);transition:transform .15s}
.chat-group-label.collapsed .icon{transform:rotate(0deg)}
.chat-thread-row{position:relative;display:flex;align-items:center;gap:2px}
.chat-thread{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;padding:9px 10px;border-radius:8px;background:transparent;color:var(--text-secondary);border:1px solid transparent}
.chat-thread:hover{background:oklch(96% .003 250)}
.chat-thread.active{background:transparent;border-color:transparent;color:var(--text-primary);font-weight:700}
.chat-thread .thread-icon{display:none}
.chat-thread .thread-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.chat-thread .thread-meta{display:none}
.thread-kebab{opacity:0;flex:0 0 auto;margin-right:4px}
.chat-thread-row:hover .thread-kebab,.thread-kebab:has(.kebab-menu){opacity:1}
.chat-main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface)}
.chat-main-top{height:64px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--border);gap:12px}
.chat-main-top h1{font-size:16px;font-weight:700;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted)}
.chat-status:before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green-500)}
.chat-tools-toggle-group{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.chat-icon-btn{position:relative;width:36px;height:36px;flex:0 0 auto;border-radius:8px;display:grid;place-items:center;color:var(--text-muted)}
.chat-icon-btn:hover{background:oklch(96% .003 250)}
.chat-icon-btn.active{background:oklch(96% .003 250);color:var(--text-primary)}
.icon-btn-dot{position:absolute;top:3px;right:3px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--red-500);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;line-height:1}
.chat-stream{flex:1;padding:28px 32px;overflow-y:auto;overflow-x:hidden;background:var(--surface);scroll-behavior:smooth}
.chat-message{display:flex;align-items:flex-start;gap:0;margin-bottom:22px}
.chat-message.assistant{justify-content:flex-start}
.chat-message.user{justify-content:flex-end}
.user-msg-col{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:72%}
.chat-message.user .chat-bubble{background:oklch(95.5% .003 250);color:var(--text-primary);max-width:100%}
.chat-message.assistant .chat-bubble{background:transparent;border:none;color:var(--text-primary);padding:0;box-shadow:none;max-width:100%}
.chat-avatar{display:none}
.chat-bubble{position:relative;max-width:72%;padding:11px 14px;border-radius:14px;font-size:13.5px;line-height:1.65}
.chat-message.user .chat-bubble{border-bottom-right-radius:4px}
.chat-bubble .source-label{font-size:14.5px;font-weight:700;color:var(--text-primary);margin-bottom:6px}
.chat-message.assistant .chat-bubble .source-label{margin-top:2px}
.chat-bubble p{margin:0 0 8px}
.chat-bubble p:last-child{margin-bottom:0}
.typing-bubble{padding:0}
.typing-dots{display:inline-flex;gap:4px}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--text-muted);animation:typing-bounce 1.1s infinite ease-in-out}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes typing-bounce{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.composer-wrap{flex:0 0 auto;padding:14px 32px 22px;background:var(--surface)}
.chat-composer{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border-strong);border-radius:999px;padding:6px 8px 6px 8px}
.composer-tooltip-wrap{position:relative;flex:0 0 auto}
.chat-composer-add{flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;border-radius:8px;background:var(--brand-50);color:var(--brand-600)}
.chat-composer-add:hover{background:var(--brand-100)}
.composer-tooltip{position:absolute;bottom:calc(100% + 10px);left:0;background:#1F2430;color:#fff;font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:8px;white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .12s;pointer-events:none;z-index:5}
.composer-tooltip-wrap:hover .composer-tooltip{opacity:1;visibility:visible}
.chat-composer textarea{flex:1;background:transparent;border:none;resize:none;min-height:24px;max-height:130px;padding:6px 4px;color:var(--text-primary);outline:none;font:inherit;font-size:13.5px}
.composer-enter-hint{flex:0 0 auto;font-size:11px;font-weight:600;color:var(--text-muted);background:oklch(96% .003 250);border-radius:6px;padding:3px 7px;margin-right:2px}
.composer-mode-wrap{position:relative;flex:0 0 auto}
.chat-mode-select{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;background:var(--surface);border:1px solid var(--border-strong);color:var(--text-secondary);font-size:12.5px;font-weight:600}
.chat-mode-select:hover{border-color:#C6CBD3}
.composer-menu{position:absolute;bottom:calc(100% + 8px);background:#fff;border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-card);min-width:180px;z-index:50;overflow:hidden;padding:4px}
.composer-menu.attach-menu{left:0}
.composer-menu.mode-menu{right:0}
.composer-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:7px;font-size:13px;color:var(--text-primary);text-align:left}
.composer-menu button:hover{background:oklch(96% .003 250)}
.composer-menu .mode-check{margin-left:auto;color:var(--brand-600);font-weight:700}
.chat-send{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--brand-600);color:#fff}
.chat-send[hidden]{display:none}
.chat-send:hover{background:var(--brand-700)}
.composer-hint{margin-top:10px;font-size:11.5px;color:var(--text-muted);text-align:center}
.composer-files-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;justify-content:flex-end}
.chat-message .composer-files-row{margin-bottom:0}
.composer-file-chip{display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);max-width:220px}
.composer-file-chip .cfc-icon{flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:var(--red-50);color:var(--red-500);display:grid;place-items:center}
.composer-file-chip .cfc-body{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.composer-file-chip .cfc-name{font-size:12px;font-weight:600;color:var(--text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px}
.composer-file-chip .cfc-size{font-size:11px;color:var(--text-muted)}
.composer-file-chip .cfc-remove{flex:0 0 auto;width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--text-muted)}
.composer-file-chip .cfc-remove:hover{background:oklch(94% .004 250);color:var(--red-500)}

/* ---------- Citation ---------- */
.citation-wrap{position:relative;display:inline-block}
.citation-chip{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;margin-left:2px;border-radius:5px;background:var(--brand-100);color:var(--brand-700);font-size:10.5px;font-weight:700;line-height:1;vertical-align:text-top;position:relative;top:-2px}
.chat-message.user .citation-chip{background:rgba(16,24,40,.08);color:var(--text-primary)}
.citation-chip:hover,.citation-chip.open{background:var(--brand-500);color:#fff}
.citation-popover{position:fixed;z-index:80;top:0;left:0;width:340px;max-width:min(340px,80vw);background:#fff;border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 20px 50px rgba(16,24,40,.22);padding:14px;text-align:left;color:var(--text-primary);font-weight:400;visibility:hidden}
.citation-popover.positioned{visibility:visible}
.citation-popover-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.citation-popover-head svg{flex:0 0 auto;color:var(--brand-600)}
.citation-popover-doc{font-weight:700;font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.citation-popover-loc{font-size:11.5px;color:var(--text-muted);margin-bottom:8px}
.citation-popover-snippet{font-size:12.5px;line-height:1.6;color:var(--text-primary);background:oklch(98% .002 250);border-left:3px solid var(--brand-400);padding:9px 11px;border-radius:0 8px 8px 0;margin-bottom:10px;max-height:130px;overflow-y:auto}
.citation-popover-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.citation-popover-meta span{font-size:10.5px;padding:3px 8px;border-radius:999px;background:oklch(95.63% .04 60);color:var(--orange-500);font-weight:600}
.citation-popover-actions{display:flex;justify-content:flex-end}

/* ---------- Inline task card (trong tin nhắn) ---------- */
.task-inline-card{display:flex;align-items:center;gap:9px;margin-top:10px;padding:9px 12px;border:1px solid var(--border-strong);border-radius:10px;background:oklch(98% .002 250);width:100%;text-align:left;color:var(--text-primary)}
.task-inline-card:hover{border-color:var(--brand-300);background:var(--brand-50)}
.task-inline-card svg{flex:0 0 auto;color:var(--text-muted)}
.task-inline-title{flex:1;min-width:0;font-weight:600;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- Tools panel (Danh sách trợ lý / Tác vụ nền) ---------- */
.chat-tools{width:320px;flex:0 0 auto;border-left:1px solid var(--border);display:flex;flex-direction:column;background:var(--surface);min-height:0}
.chat-tools-head{height:70px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 18px;border-bottom:1px solid var(--border);gap:8px}
.chat-tools-tabs{display:flex;gap:4px;background:oklch(94% .004 250);padding:3px;border-radius:10px}
.tool-tab{padding:8px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--text-secondary);white-space:nowrap}
.tool-tab.active{background:#fff;color:var(--brand-600);box-shadow:0 1px 2px rgba(16,24,40,.08)}
.chat-tools-body{flex:1;overflow-y:auto;padding:16px 18px}
.tools-panel-sub{font-size:12px;color:var(--text-muted);margin:0 0 14px;line-height:1.5}
.agent-list-item{display:flex;gap:11px;padding:12px;border:1px solid var(--border-strong);border-radius:12px;margin-bottom:10px}
.agent-list-item:hover{border-color:var(--brand-300);box-shadow:var(--shadow-card)}
.agent-avatar{flex:0 0 auto;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:#fff}
.agent-list-item-body{flex:1;min-width:0}
.agent-list-item-name{font-weight:700;font-size:13.5px;margin-bottom:3px}
.agent-list-item-desc{font-size:12px;color:var(--text-muted);line-height:1.5;margin-bottom:8px}
.task-list-item{padding:12px;border:1px solid var(--border-strong);border-radius:12px;margin-bottom:10px}
.task-list-item:hover{border-color:var(--brand-300);box-shadow:var(--shadow-card)}
.task-list-item-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.task-list-item-title{font-weight:600;font-size:13px;flex:1;min-width:0}
.task-list-item-meta{font-size:11.5px;color:var(--text-muted)}

/* ---------- Document viewer (truy nguồn) ---------- */
.doc-viewer{display:flex;flex-direction:column;max-height:72vh}
.doc-viewer-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.doc-viewer-title{display:flex;align-items:flex-start;gap:10px;min-width:0}
.doc-viewer-title svg{flex:0 0 auto;margin-top:2px;color:var(--brand-600)}
.doc-viewer-name{font-weight:700;font-size:16px}
.doc-viewer-loc{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.doc-viewer-body{flex:1;overflow-y:auto;padding:2px 2px 2px 0;font-size:13.5px;line-height:1.75;color:var(--text-primary)}
.doc-viewer-breadcrumb{font-size:11.5px;color:var(--text-muted);margin-bottom:12px}
.doc-viewer-breadcrumb .crumb-sep{margin:0 4px;color:var(--border-strong)}
.doc-viewer-highlight{background:oklch(93% .09 95);border-left:3px solid var(--orange-500);padding:9px 11px;border-radius:0 8px 8px 0;scroll-margin:20px}
.doc-viewer-sheet-label{font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:10px}
td.doc-viewer-highlight,th.doc-viewer-highlight{border-radius:0;display:table-cell;border-left:3px solid var(--orange-500)}

/* ---------- Sidebar Usage ---------- */
.usage-card{
  margin:12px 0 14px; padding:14px 12px; border-radius:12px;
  background:var(--surface); border:1px solid var(--border-strong);
  box-shadow:var(--shadow-card);
}
.usage-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.usage-title{margin:0;font-size:13px;font-weight:700;color:var(--text-primary)}
.usage-percent{font-size:14px;font-weight:800;color:var(--brand-600)}
.usage-bar{height:6px;border-radius:99px;background:oklch(90% .006 250);overflow:hidden}
.usage-fill{height:100%;width:30%;background:linear-gradient(90deg,var(--brand-500),var(--brand-300));border-radius:99px}
.usage-size{margin-top:8px;font-size:12px;color:var(--text-muted)}

/* ---------- Main ---------- */
.main{
  margin-left:var(--sidebar-w); margin-top:var(--topbar-h);
  padding:12px 24px 40px; transition:margin-left .18s ease;
  min-height:calc(100vh - var(--topbar-h));
}
body.collapsed .main{margin-left:var(--sidebar-w-collapsed)}
.panel{
  background:var(--surface); border-radius:var(--radius-lg); box-shadow:var(--shadow-card);
  padding:28px 32px 36px; max-width:1180px; margin:0 auto; min-height:calc(100vh - var(--topbar-h) - 60px);
}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em;margin:0 0 10px}
.page-sub{color:var(--text-secondary);font-size:15px;margin:0 0 24px}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.search{
  flex:1 1 320px;max-width:380px;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;
  background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;color:var(--text-muted)
}
.search:focus-within{border-color:var(--brand-400);box-shadow:0 0 0 3px var(--brand-50)}
.search input{flex:1;border:none;outline:none;background:none;color:var(--text-primary)}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden}
.seg button{width:44px;height:44px;display:grid;place-items:center;color:var(--text-secondary)}
.seg button.active{background:var(--brand-50);color:var(--brand-600)}
.btn{display:inline-flex;align-items:center;gap:9px;height:44px;padding:0 18px;border-radius:10px;font-weight:600;font-size:14px}
.btn-ghost{border:1px solid var(--border-strong);background:var(--surface);color:var(--text-primary)}
.btn-ghost:hover{background:oklch(97% .004 250)}
.btn-primary{background:var(--brand-500);color:#fff}
.btn-primary:hover{background:var(--brand-600)}
.btn-sm{height:38px;padding:0 14px;font-size:13px;border-radius:9px}
.ml-auto{margin-left:auto}

/* ---------- Table ---------- */
.table-wrap{border:1px solid var(--border-strong);border-radius:12px;overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{
  text-align:left;padding:16px 20px;font-size:12px;font-weight:700;letter-spacing:.07em;
  color:var(--text-secondary);background:oklch(98% .002 250);border-bottom:1px solid var(--border-strong)
}
tbody td{padding:16px 20px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover{background:oklch(98.5% .002 250)}
.cell-title{font-weight:600;font-size:16px}
.cell-desc{color:var(--text-muted);font-size:13px;margin-top:2px}
.muted{color:var(--text-muted)}
.date{color:var(--text-secondary)}
.badge{display:inline-flex;align-items:center;flex:0 0 auto;max-width:100%;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.status-help{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:5px;border:1px solid currentColor;border-radius:50%;font-size:10px;font-weight:700;line-height:1;color:currentColor;cursor:help}
.badge-active{background:var(--green-50);color:var(--green-700)}
.badge-done{background:var(--green-50);color:var(--green-700)}
.badge-error{background:var(--red-50);color:var(--red-500)}
.badge-neutral{background:oklch(94% .004 250);color:var(--text-secondary)}
.badge-warn{background:oklch(95.63% .04 60);color:var(--orange-500)}

/* ---------- Grid cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{border:1px solid var(--border-strong);border-radius:12px;padding:18px;background:var(--surface);cursor:pointer}
.card:hover{border-color:var(--brand-300);box-shadow:var(--shadow-card)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.card-title{font-weight:600;font-size:17px}
.card-meta{display:flex;gap:18px;margin-top:16px;color:var(--text-muted);font-size:12px}
.card-meta b{display:block;color:var(--text-primary);font-size:15px;font-weight:600;margin-top:2px}

/* ---------- Detail ---------- */
.detail-head{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.back{width:40px;height:40px;border-radius:10px;border:1px solid var(--border-strong);display:grid;place-items:center;background:var(--surface)}
.back:hover{background:oklch(97% .004 250)}
.detail-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:30px;font-weight:700;letter-spacing:-.02em}
.quality-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:oklch(98% .002 250)}
.quality-bar .quality-count{color:var(--text-secondary);font-size:12px}
.quality-warning{color:var(--orange-500);font-size:12px;font-weight:600}
.doc-actions{display:flex;gap:6px;justify-content:flex-end;white-space:nowrap}
.stats{display:flex;gap:16px;margin:22px 0 8px;overflow-x:auto}
.stat{width:180px;min-width:180px;height:100px;border:1px solid var(--border-strong);border-radius:12px;padding:18px 20px}
.stat-label{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text-secondary)}
.stat-value{font-size:28px;font-weight:700;margin:8px 0 6px}
.stat-hint{font-size:12px;color:var(--text-muted)}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--border-strong);margin:28px 0 22px}
.tab{display:flex;align-items:center;gap:8px;padding:12px 2px 14px;color:var(--text-secondary);font-weight:500;
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--brand-600);border-bottom-color:var(--brand-500);font-weight:600}
.section-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.section-title{font-weight:700;font-size:17px}
.section-sub{color:var(--text-muted);font-size:13px}

/* ---------- Empty / placeholder ---------- */
.empty{display:grid;place-items:center;gap:10px;padding:70px 20px;color:var(--text-muted);text-align:center}
.empty h3{margin:0;color:var(--text-primary);font-size:18px}
.empty .btn{margin-top:6px}

/* ---------- Bulk selection ---------- */
.checkbox-col{width:44px}
.row-checkbox{width:17px;height:17px;accent-color:var(--brand-500);cursor:pointer;display:block}
.card-head .row-checkbox{flex:0 0 auto;margin-top:3px}
.selection-bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--brand-50);border:1px solid var(--brand-300);border-radius:10px;margin-bottom:16px;font-size:13.5px;font-weight:600;color:var(--brand-700)}
.selection-actions{display:flex;gap:8px;margin-left:auto}
.trash-days{color:var(--text-muted);font-size:13px}
.trash-days.warn{color:var(--orange-500);font-weight:600}
.btn-danger{background:var(--red-500);color:#fff}
.btn-danger:hover{background:oklch(50% .19 25)}
.warn-box{display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:oklch(95.63% .04 60);margin:14px 0;font-size:13px;color:var(--text-primary)}
.warn-box svg{flex-shrink:0;color:var(--orange-500);margin-top:1px}
.warn-box ul{margin:6px 0 0;padding-left:18px}
.warn-box li{margin-bottom:2px}
.delete-list{margin:12px 0 0;padding-left:18px;font-size:13.5px;color:var(--text-primary)}
.delete-list li{margin-bottom:4px}

/* ---------- Tags / labels ---------- */
.tag-list{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:500;background:oklch(94% .004 250);color:var(--text-secondary);white-space:nowrap}
.tag-chip.removable{padding-right:4px}
.tag-chip button{display:flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;color:inherit;flex:0 0 auto}
.tag-chip button svg{width:9px;height:9px;stroke-width:2.4}
.tag-chip button:hover{background:rgba(16,24,40,.14)}
.tag-more{font-size:11px;color:var(--text-muted)}
.tag-add-btn{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;border:1px dashed var(--border-strong);color:var(--text-muted);flex:0 0 auto}
.tag-add-btn:hover{border-color:var(--brand-400);color:var(--brand-600);background:var(--brand-50)}
.tag-add-btn svg{width:11px;height:11px;stroke-width:2.2}

/* ---------- Filter dropdown ---------- */
.filter-dropdown{position:relative}
.filter-trigger{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--border-strong);border-radius:10px;background:var(--surface);color:var(--text-primary);font-size:13.5px}
.filter-trigger:hover{border-color:#C6CBD3}
.filter-trigger .count{background:var(--brand-500);color:#fff;font-size:10.5px;font-weight:700;border-radius:999px;padding:1px 6px;min-width:16px;text-align:center}
.filter-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:50;min-width:230px;max-height:280px;overflow-y:auto;background:#fff;border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-card);padding:8px}
.filter-menu-empty{padding:14px 10px;color:var(--text-muted);font-size:13px;text-align:center}
.filter-menu-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13.5px}
.filter-menu-item:hover{background:oklch(97% .004 250)}
.filter-menu-item input{accent-color:var(--brand-500)}
.filter-menu-footer{border-top:1px solid var(--border);margin-top:6px;padding-top:6px}
.filter-clear{width:100%;text-align:left;padding:8px 10px;color:var(--brand-600);font-size:13px;font-weight:600;border-radius:8px}
.filter-clear:hover{background:oklch(97% .004 250)}

/* ---------- Sửa tên/mô tả KB (icon edit dùng chung, mở modal) ---------- */
.field-hover{display:flex;align-items:center;gap:6px}
.field-hover .field-edit-btn{opacity:0;flex-shrink:0;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:5px;color:var(--text-muted);cursor:pointer;transition:opacity .12s,background .12s}
.field-hover:hover .field-edit-btn,.field-hover .field-edit-btn:focus-visible{opacity:1}
.field-hover .field-edit-btn:hover{background:oklch(95% .006 250);color:var(--text-primary)}
.icon-xs{width:13px;height:13px}
.detail-field{display:flex;align-items:center;gap:8px;min-width:0}
.detail-field .field-edit-btn{flex:0 0 auto;width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:5px;color:var(--text-muted);cursor:pointer}
.detail-field .field-edit-btn:hover{background:oklch(95% .006 250);color:var(--text-primary)}
.detail-field-input{width:min(620px,100%);padding:6px 9px;border:1px solid var(--brand-400);border-radius:8px;outline:none;font:inherit;box-shadow:0 0 0 3px var(--brand-50)}
.detail-field textarea.detail-field-input{resize:vertical;min-height:44px}
.detail-field-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}
.detail-field-actions button{width:24px;height:24px;display:grid;place-items:center;border:0;border-radius:5px;color:var(--text-muted);cursor:pointer}
.detail-field-actions button:hover{background:oklch(95% .006 250);color:var(--text-primary)}

/* ---------- Label combobox (modal) ---------- */
.label-combo input{width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:8px;font-size:13.5px;outline:none}
.label-combo input:focus{border-color:var(--brand-400);box-shadow:0 0 0 3px var(--brand-50)}
.label-suggest{border:1px solid var(--border-strong);border-radius:8px;margin-top:8px;max-height:180px;overflow-y:auto}
.label-suggest-item{padding:9px 12px;font-size:13.5px;cursor:pointer}
.label-suggest-item:hover{background:oklch(97% .004 250)}
.label-suggest-item.create{color:var(--brand-600);font-weight:600}
.label-suggest-empty{padding:10px 12px;font-size:12.5px;color:var(--text-muted)}
.label-chips-area{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;min-height:26px}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.45);display:grid;place-items:center;z-index:60;padding:20px}
.modal{background:#fff;border-radius:16px;width:min(520px,100%);padding:26px 26px 22px;box-shadow:0 24px 60px rgba(16,24,40,.25)}
.modal h2{margin:0 0 6px;font-size:20px}
.modal p.sub{margin:0 0 20px;color:var(--text-muted);font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;padding:11px 13px;border:1px solid var(--border-strong);border-radius:10px;outline:none;background:#fff
}
.field input:focus,.field textarea:focus{border-color:var(--brand-400);box-shadow:0 0 0 3px var(--brand-50)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}

/* ---------- Floating helpers ---------- */
.kebab-wrap{position:relative}
.kebab-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--text-secondary)}
.kebab-btn:hover{background:oklch(94% .004 250)}
.kebab-menu{position:absolute;right:0;top:40px;background:#fff;border:1px solid var(--border-strong);border-radius:10px;box-shadow:var(--shadow-card);min-width:190px;z-index:50;overflow:hidden}
.kebab-menu button{white-space:nowrap}
.kebab-menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;font-size:14px;text-align:left}
.kebab-menu button:hover{background:oklch(97% .004 250)}
.kebab-menu .kebab-divider{border-top:1px solid var(--border);margin:4px 0}
.kebab-menu button.danger{color:var(--red-500)}
.kebab-menu button.danger:hover{background:var(--red-50)}
.kebab-backdrop{position:fixed;inset:0;z-index:45}
.share-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.share-row:last-child{border-bottom:none}
.share-avatar{width:34px;height:34px;border-radius:50%;background:var(--brand-100);color:var(--brand-700);display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto}
.share-name{font-weight:500;flex:1}
.share-role-select{padding:7px 10px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px}
.access-option{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--border-strong);border-radius:10px;cursor:pointer}
.access-option input{margin-top:3px}
.access-option.active{border-color:var(--brand-400);background:var(--brand-50)}
.access-option-title{font-weight:600;font-size:14px}
.access-option-sub{color:var(--text-muted);font-size:12px;margin-top:2px}
.publish-menu{position:absolute;right:0;top:44px;background:#fff;border:1px solid var(--border-strong);border-radius:12px;box-shadow:var(--shadow-card);width:300px;z-index:50;padding:14px}
.modal-lg{width:min(760px,95%);max-height:85vh;overflow-y:auto}
/* ---------- KB wizard (inline, part of .panel) ---------- */
.kbw{
  --bg:#F6F7F9; --surface:#FFFFFF; --border:#DEE2E8; --ink:#171A23; --muted:#5C6270;
  --accent: oklch(48.82% .2172 264.4);
  --accent-light: color-mix(in oklch, var(--accent) 12%, white);
  --accent-dark: color-mix(in oklch, var(--accent) 82%, black);
  --amber:#B7791F; --amber-light:#FBF0DD; --danger:#C0392B;
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  display:flex; flex-direction:column;
  height:calc(100vh - var(--topbar-h) - 64px); min-height:480px;
}
.kbw select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--ink);}

.kbw .wiz-topbar{display:flex;align-items:center;justify-content:space-between;margin:-28px -32px 0;padding:16px 32px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--surface);}
.kbw .wiz-back{display:flex;align-items:center;gap:8px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);padding:6px 8px;border-radius:6px;}
.kbw .wiz-back:hover{background:var(--bg);}
.kbw .wiz-back svg{flex-shrink:0;}
.kbw .wiz-stepper{display:flex;align-items:center;gap:10px;}
.kbw .wiz-step{display:flex;align-items:center;gap:8px;}
.kbw .wiz-step-num{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--border);color:var(--muted);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kbw .wiz-step-pill{background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:4px 10px;border-radius:20px;text-transform:uppercase;flex-shrink:0;}
.kbw .wiz-step-label{font-size:12px;font-weight:600;letter-spacing:.03em;color:var(--muted);text-transform:uppercase;white-space:nowrap;}
.kbw .wiz-step-label.active{color:var(--accent);}
.kbw .wiz-dash{width:22px;height:1px;background:var(--border);flex-shrink:0;}

.kbw .wbtn{padding:9px 18px;border-radius:6px;font-size:13.5px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink);}
.kbw .wbtn:hover{border-color:#C6CBD3;}
.kbw .wbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.kbw .wbtn.primary:hover{background:var(--accent-dark);}
.kbw .wbtn:disabled{opacity:0.4;cursor:not-allowed;}
.kbw .wbtn.primary:disabled:hover{background:var(--accent);}
.kbw .footer-actions{display:flex;justify-content:flex-end;gap:10px;margin:0 -32px -36px;padding:18px 32px;border-top:1px solid var(--border);flex-shrink:0;background:var(--surface);}

.kbw .screen{display:none;}
.kbw .screen.visible{display:flex;flex-direction:column;flex:1;min-height:0;}
.kbw .screen-body{padding:24px 0 4px;flex:1;min-height:0;overflow-y:auto;}
.kbw h1.page-title{font-size:19px;margin:0 0 4px;font-weight:600;}
.kbw .wiz-sub{color:var(--muted);margin:0 0 24px;font-size:13.5px;}

.kbw .step1-section{margin-bottom:32px;}
.kbw .step1-section-label{font-size:12.5px;font-weight:600;color:var(--muted);margin:0 0 12px;}

.kbw .source-tabbar{display:flex;gap:32px;border-bottom:1px solid var(--border);margin-bottom:20px;}
.kbw .source-tab{display:flex;align-items:center;gap:7px;padding:0 0 13px;border:none;background:none;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted);position:relative;top:1px;}
.kbw .source-tab .icn{font-size:14px;line-height:1;}
.kbw .source-tab:hover{color:var(--ink);}
.kbw .source-tab.selected{color:var(--ink);}
.kbw .source-tab.selected::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);border-radius:2px 2px 0 0;}

.kbw .source-panel-inner{border:1px solid var(--border);border-radius:10px;background:var(--surface);padding:22px;}

.kbw .dropzone{border:1.5px dashed var(--border);border-radius:8px;padding:30px 20px;text-align:center;color:var(--muted);cursor:pointer;}
.kbw .dropzone:hover{border-color:var(--accent);background:var(--accent-light);}
.kbw .dropzone .icn{font-size:22px;margin-bottom:8px;color:var(--accent);display:block;}
.kbw .dropzone .primary-line{color:var(--ink);font-size:13.5px;}
.kbw .dropzone .hint{font-size:12px;margin-top:5px;color:var(--muted);}

.kbw .panel-hint{font-size:12px;color:var(--muted);margin-top:10px;}

.kbw .added-list-card{border:1px solid var(--border);border-radius:10px;background:var(--surface);overflow:hidden;}
.kbw .added-list-header{display:flex;justify-content:space-between;align-items:center;padding:11px 18px;background:#FAFBFC;border-bottom:1px solid var(--border);}
.kbw .added-list-header .title{font-size:12.5px;color:var(--muted);}
.kbw .added-list-header .title .count{font-family:var(--mono);color:var(--ink);font-weight:600;}
.kbw .added-list-empty{padding:22px 18px;text-align:center;color:var(--muted);font-size:12.5px;}

.kbw .file-row{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--bg);}
.kbw .file-row:last-child{border-bottom:none;}
.kbw .file-row .fname{font-weight:500;flex:1;font-size:13px;}

.kbw .file-status{font-size:11.5px;font-weight:600;white-space:nowrap;}
.kbw .file-status.pending{color:var(--muted);}
.kbw .file-status.uploading{color:var(--accent);}
.kbw .file-status.success{color:var(--accent-dark);}
.kbw .file-status.failed{color:var(--danger);}
.kbw .file-progress-value{font-size:10.5px;color:var(--muted);font-family:var(--mono);}
.kbw .file-progress-track{height:5px;background:var(--bg);border-radius:999px;overflow:hidden;}
.kbw .file-progress-fill{height:100%;width:0;background:var(--accent);border-radius:inherit;transition:width .12s linear;}
.kbw .file-progress-fill.success{background:var(--accent-dark);}
.kbw .file-progress-fill.failed{background:var(--danger);}
.kbw .upload-error{display:flex;align-items:flex-start;gap:10px;margin:0 18px 11px 42px;padding:8px 10px;border-left:2px solid var(--danger);background:#FDEDEC;border-radius:0 6px 6px 0;font-size:11.5px;color:var(--danger);}

.kbw .upload-error .retry-btn{border:1px solid var(--danger);color:var(--danger);background:#fff;padding:3px 9px;border-radius:14px;font-size:11px;cursor:pointer;white-space:nowrap;}
.kbw .upload-error .retry-btn:disabled{opacity:.55;cursor:not-allowed;}
.kbw .upload-error .retry-info{display:block;margin-top:3px;color:#8E3026;font-size:10.5px;}
.kbw .item-wrap:last-child .file-row{border-bottom:none;}

.kbw .url-input-row{display:flex;gap:10px;}
.kbw .url-input-row input{flex:1;padding:9px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--mono);}
.kbw .url-input-row input:focus{outline:none;border-color:var(--accent);}

.kbw .connector-blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;}
.kbw .connector-block{border:1px solid var(--border);border-radius:8px;padding:16px;background:var(--surface);display:grid;grid-template-rows:34px minmax(42px,1fr) 36px;gap:10px;min-width:0;min-height:164px;}

.kbw .connector-block-content{font-size:11.5px;color:var(--muted);line-height:1.45;overflow:hidden;}

.kbw .connector-connected{border-top:1px solid var(--border);padding-top:16px;}

.kbw .connector-item-row{display:flex;align-items:center;gap:10px;padding:8px 6px;font-size:13px;border-radius:6px;cursor:pointer;}
.kbw .connector-item-row:hover{background:var(--bg);}

.kbw .split{display:grid;grid-template-columns:45fr 55fr;flex:1;min-height:0;}
.kbw .pane{padding:24px;overflow-y:auto;min-height:0;}

.kbw .pane-right{background:#FAFBFC;}

.kbw .cs-heading{font-size:15px;font-weight:700;margin:0 0 14px;}
.kbw .mode-card, .kbw .sub-mode-card{display:flex;align-items:flex-start;gap:12px;border:1.5px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;background:var(--surface);}
.kbw .mode-card:hover, .kbw .sub-mode-card:hover{border-color:#C6CBD3;}
.kbw .mode-card.selected, .kbw .sub-mode-card.selected{border-color:var(--accent);background:color-mix(in oklch, var(--accent) 5%, white);}
.kbw .mode-card-icon{width:34px;height:34px;border-radius:8px;background:var(--accent-light);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kbw .mode-card-icon svg{width:18px;height:18px;}
.kbw .mode-card-body{flex:1;min-width:0;}
.kbw .mode-card-title{font-weight:600;font-size:13.5px;color:var(--ink);margin-bottom:3px;}
.kbw .mode-card-desc{font-size:12px;color:var(--muted);line-height:1.5;}
.kbw .mode-card-radio{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border);flex-shrink:0;margin-top:2px;position:relative;}
.kbw .mode-card.selected .mode-card-radio, .kbw .sub-mode-card.selected .mode-card-radio{border-color:var(--accent);}
.kbw .mode-card.selected .mode-card-radio::after, .kbw .sub-mode-card.selected .mode-card-radio::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--accent);}

.kbw .cs-block{display:none;margin:4px 0 22px;}
.kbw .cs-block.open{display:block;}
.kbw .cs-section-label{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px;}
.kbw .field-row-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px;}
.kbw .mini-label{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--ink);margin-bottom:6px;}
.kbw .qmark{width:13px;height:13px;border-radius:50%;border:1px solid var(--border);color:var(--muted);font-size:9px;display:inline-flex;align-items:center;justify-content:center;cursor:help;flex-shrink:0;}
.kbw .cs-input{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:12.5px;font-family:var(--mono);background:var(--surface);color:var(--ink);}
.kbw .cs-input:focus{outline:none;border-color:var(--accent);}
.kbw .stepper-input{display:flex;align-items:center;border:1px solid var(--border);border-radius:6px;background:var(--surface);padding:0 4px 0 10px;}
.kbw .stepper-input input{flex:1;min-width:0;border:none;background:none;outline:none;padding:7px 0;font-size:12.5px;font-family:var(--mono);color:var(--ink);}

.kbw .stepper-arrows button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:8px;line-height:1;padding:3px 6px;}
.kbw .stepper-arrows button:hover{color:var(--ink);background:var(--bg);}

.kbw .cs-checkbox-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);margin-bottom:8px;cursor:pointer;}
.kbw .cs-checkbox-row input{accent-color:var(--accent);width:15px;height:15px;flex-shrink:0;}
.kbw .cs-preview-btn-row{margin-top:24px;}

.kbw .preview-toolbar{margin-bottom:16px;}
.kbw .preview-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:10px;}
.kbw .preview-file-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.kbw .preview-file-select{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:var(--surface);flex:1;min-width:180px;}
.kbw .preview-file-select .pf-icn{width:20px;height:20px;border-radius:4px;background:#3B82F6;color:#fff;font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.kbw .preview-file-select select{border:none;background:none;outline:none;flex:1;font-size:12.5px;padding:0;color:var(--ink);}
.kbw .est-chunks-badge{font-size:11px;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 12px;white-space:nowrap;}
.kbw .preview-empty{height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:14px;font-size:13px;padding:0 40px;}
.kbw .preview-empty-icn{color:#C6CBD3;}
.kbw .chunk{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:12px 14px;margin-bottom:10px;}
.kbw .chunk .chunk-top{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:6px;}
.kbw .chunk .chunk-top .chunk-file{color:var(--muted);}
.kbw .chunk .chunk-text{font-size:12.5px;color:var(--ink);}

.kbw .exec-list{max-width:640px;}
.kbw .exec-file{border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:16px;margin-bottom:12px;}
.kbw .exec-file .top{display:flex;justify-content:space-between;margin-bottom:10px;}
.kbw .exec-file .name{font-weight:600;font-size:13.5px;}
.kbw .exec-file .pct{font-family:var(--mono);font-size:12.5px;color:var(--muted);}
.kbw .stages{display:flex;gap:6px;font-size:11px;color:var(--muted);margin-bottom:8px;font-family:var(--mono);}
.kbw .stages span.done{color:var(--accent);}
.kbw .bar-track{height:6px;border-radius:4px;background:var(--bg);overflow:hidden;}
.kbw .bar-fill{height:100%;background:var(--accent);width:0%;transition:width 0.3s;}
.kbw .kb-ready{margin-top:24px;padding:16px 18px;border-radius:8px;background:var(--accent-light);color:var(--accent-dark);font-size:13.5px;display:none;}
.kbw .kb-ready.show{display:block;}

.kbw .modal-overlay{position:fixed;inset:0;padding:20px;background:rgba(23,26,35,0.45);display:none;align-items:center;justify-content:center;z-index:200;overflow-y:auto;}
.kbw .modal-overlay.show{display:flex;}
.kbw .wmodal{background:var(--surface);border-radius:10px;padding:24px;width:min(400px,100%);max-height:calc(100vh - 40px);overflow-y:auto;box-shadow:0 12px 32px rgba(0,0,0,0.18);}
.kbw .wmodal h3{margin:0 0 16px;font-size:15px;}
.kbw .wmodal label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;margin-top:14px;}
.kbw .wmodal input[type=text], .kbw .wmodal textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;}
.kbw .wmodal textarea{resize:vertical;min-height:56px;}
.kbw .wmodal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

.kbw .modal-wide{width:min(620px,100%);}
.kbw .modal-header-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.kbw .modal-header-row h3{margin:0;}
.kbw .modal-header-actions{display:flex;align-items:center;gap:4px;}
.kbw .modal-close{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:4px 6px;border-radius:6px;}
.kbw .modal-close:hover{background:var(--bg);}
.kbw .modal-reset-btn{border:none;background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:500;padding:4px 10px;border-radius:6px;}
.kbw .modal-reset-btn:hover{background:var(--bg);color:var(--ink);}

.kbw .provider-select-row{display:flex;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.kbw .connector-source-dropdown{position:relative;flex:1 1 220px;min-width:180px;}
.kbw .connector-source-trigger{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;text-align:left;}
.kbw .connector-source-trigger:hover{border-color:#C6CBD3;}
.kbw .connector-source-trigger .summary{flex:1;min-width:0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.kbw .connector-source-trigger .chevron{flex-shrink:0;color:var(--muted);font-size:12px;}
.kbw .connector-source-menu{position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:10;display:none;height:min(210px,40vh);overflow-y:auto;overscroll-behavior:contain;padding:8px 0;border:1px solid var(--border);border-radius:6px;background:var(--surface);box-shadow:0px 2px 4px rgba(23,26,35,0.08),0px 8px 20px rgba(23,26,35,0.12);}
.kbw .connector-source-dropdown.open .connector-source-menu{display:block;}
.kbw .wmodal label.connector-source{display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;min-height:44px;margin:0;padding:6px 16px;text-align:left;border:0;border-radius:0;background:transparent;cursor:pointer;font-weight:400;}
.kbw .connector-source:hover{background:rgba(23,26,35,0.04);}
.kbw .connector-source:focus-within{background:rgba(23,26,35,0.06);}
.kbw .connector-source.selected{background:color-mix(in oklch, var(--accent) 8%, transparent);}
.kbw .connector-source.selected:hover{background:color-mix(in oklch, var(--accent) 12%, transparent);}
.kbw .connector-source input{flex:0 0 18px;width:18px;height:18px;min-width:0;padding:0;border:0;accent-color:var(--accent);margin:0;cursor:pointer;}
.kbw .connector-source .avatar{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--ink);color:#fff;font-size:10px;font-weight:600;flex-shrink:0;}
.kbw .connector-source .source-text{flex:1;min-width:0;overflow:hidden;}
.kbw .connector-source .source-name{display:block;font-size:13px;font-weight:400;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kbw .connector-source .source-meta{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.kbw .provider-select-row > select{width:190px;flex-shrink:0;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--surface);color:var(--ink);}
.kbw .provider-select-row > input{flex:1 1 180px;min-width:140px;padding:8px 12px;border:1px solid var(--border);border-radius:6px;font-size:13px;}
.kbw .provider-select-row > input:focus{outline:none;border-color:var(--accent);}

.kbw .remote-list-card{border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.kbw .remote-list-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#FAFBFC;border-bottom:1px solid var(--border);font-size:12.5px;color:var(--muted);}
.kbw .remote-list-header .rl-left{font-family:var(--mono);}
.kbw .remote-list-header #rl-instance-name{color:var(--ink);font-weight:500;}
.kbw .rl-right{display:flex;align-items:center;gap:10px;}
.kbw .rl-badge{font-family:var(--mono);background:var(--bg);padding:2px 9px;border-radius:20px;font-size:11px;}
.kbw .rl-refresh-btn{border:none;background:none;color:var(--accent);font-weight:600;font-size:11.5px;cursor:pointer;padding:2px 2px;}
.kbw .rl-refresh-btn:hover{color:var(--accent-dark);text-decoration:underline;}
.kbw .rl-refresh-btn:disabled{color:var(--muted);cursor:default;text-decoration:none;}
.kbw .remote-list-body{height:260px;overflow-y:auto;padding:6px;}
.kbw .remote-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);gap:4px;}
.kbw .remote-empty-icn{font-size:24px;margin-bottom:4px;}
.kbw .remote-empty .primary-line{font-size:13.5px;color:var(--ink);}
.kbw .remote-item-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;}
.kbw .remote-item-row:hover{background:var(--bg);}
.kbw .remote-item-row input{accent-color:var(--accent);}
.kbw .remote-item-row .r-icn{color:var(--muted);width:16px;text-align:center;}
.kbw .remote-item-row .r-name{flex:1;}
.kbw .remote-loading{height:100%;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;}

/* ---------- toast (app-wide) ---------- */
.toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:#171A23;color:#fff;padding:11px 20px;border-radius:8px;font-size:13px;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);opacity:0;pointer-events:none;transition:opacity 0.2s;
  z-index:70;
}
.toast.show{opacity:1;}
.fab-col{position:fixed;right:18px;bottom:60px;display:flex;flex-direction:column;gap:18px;color:var(--text-muted);z-index:20}
[hidden]{display:none!important}
@media(max-width:900px){.sidebar{display:none}.main{margin-left:0}}

function mockAssistantReply(session){
  const pool = [
    {agent:null, text:'Tôi đã ghi nhận yêu cầu của bạn. Trợ lý sẽ điều phối tới agent phù hợp trong workspace để xử lý và phản hồi chi tiết ngay sau đây.'},
    {agent:'agent-nhansu', text:'Tôi đã kiểm tra thông tin liên quan trong Kho tri thức nhân sự và tổng hợp nội dung phù hợp với yêu cầu của bạn.'},
    {agent:'agent-dataanalyst', text:'Tôi đã truy vấn dữ liệu liên quan trong Lakehouse. Bạn có muốn tôi tổng hợp thêm theo mốc thời gian khác không?'},
  ];
  const pick = pool[session.messages.length % pool.length];
  return {id:'m'+Date.now(), role:'assistant', agent:pick.agent, text:pick.text, citations:[]};
}
function sendChatMessage(){
  const ta = document.getElementById('composer-input');
  if(!ta) return;
  const text = ta.value.trim();
  const files = state.chatComposerFiles.slice();
  if(!text && !files.length) return;
  const session = getActiveSession();
  session.messages.push({id:'m'+Date.now(), role:'user', text, citations:[], files: files.length?files:undefined});
  const titleSource = text || files[0].name;
  if(session.title==='Hội thoại mới') session.title = titleSource.length>40 ? titleSource.slice(0,40)+'…' : titleSource;
  session.updatedAt = 'Vừa xong';
  session.group = 'Hôm nay';
  ta.value = '';
  state.chatComposerFiles = [];
  state.chatTyping = session.id;
  state.chatShouldScroll = true;
  render();
  const sid = session.id;
  setTimeout(()=>{
    state.chatTyping = null;
    session.messages.push(mockAssistantReply(session));
    if(getActiveSession().id===sid){ state.chatShouldScroll = true; render(); }
  }, 1000 + Math.random()*500);
}
function toggleCitation(sessionId, msgId, citId){
  if(!sessionId){ state.chatOpenCitation=null; render(); return; }
  const cur = state.chatOpenCitation;

function positionCitationPopover(){
  const pop = document.querySelector('.citation-popover');
  const trigger = document.querySelector('.citation-chip.open');
  if(!pop || !trigger) return;
  const tr = trigger.getBoundingClientRect();
  const pw = pop.offsetWidth || 340;
  const ph = pop.offsetHeight || 200;
  let left = tr.left;
  let top = tr.top - ph - 8;
  if(top < 8) top = tr.bottom + 8;
  if(left + pw > window.innerWidth - 8) left = window.innerWidth - pw - 8;
  if(left < 8) left = 8;
  if(top + ph > window.innerHeight - 8) top = Math.max(8, window.innerHeight - ph - 8);
  pop.style.left = left+'px';
  pop.style.top = top+'px';
  pop.classList.add('positioned');
}
function findCitation(sessionId, msgId, citId){
  const s = CHAT_SESSIONS.find(x=>x.id===sessionId);

    case 'html': return `Trang nội bộ · ${doc.hierarchy ? doc.hierarchy.join(' › ') : ''}`;

  const value = input.value.trim();
  if(field==='name'){
    if(!value){ showToast('Tên không được để trống'); return; }
    if(value.length>120){ showToast('Tên tối đa 120 ký tự'); return; }
    const dup = KBS.some(other=>other.id!==kb.id && !other.trashed && other.name.toLowerCase()===value.toLowerCase());
    if(dup){ showToast('Tên đã tồn tại trong Workspace'); return; }
    kb.name=value;
  } else {
    if(value.length>500){ showToast('Mô tả tối đa 500 ký tự'); return; }
    kb.desc=value||'Không có mô tả';
  }
  kb.updated=new Date().toLocaleDateString('vi-VN');

  state.detailEditField=null;
  render();

    state.labelDraft.forEach(l=>{ if(!kb.labels.some(x=>x.toLowerCase()===l.toLowerCase())) kb.labels.push(l); });
  });

  state.selected=[];
  showToast(`Đã gán nhãn cho ${ids.length} Knowledge Base`);
  render();
}
function renderBulkLabelModalBody(){

/* ---------- label filter dropdown (toolbar) ---------- */
function toggleLabelFilterMenu(){ state.labelFilterOpen = !state.labelFilterOpen; render(); }
function closeLabelFilterMenu(){ state.labelFilterOpen = false; render(); }
function toggleLabelFilter(label){
  const i = state.labelFilter.indexOf(label);
  if(i===-1) state.labelFilter.push(label); else state.labelFilter.splice(i,1);
  render();
}
function labelFilterDropdown(){
  const count = state.labelFilter.length;
  return `<div class="filter-dropdown">
    <button class="filter-trigger" onclick="event.stopPropagation();toggleLabelFilterMenu()">
      ${svg('tag','icon icon-sm')} Nhãn${count?` <span class="count">${count}</span>`:''}
    </button>
    ${state.labelFilterOpen?`<div class="kebab-backdrop" onclick="closeLabelFilterMenu()"></div>
    <div class="filter-menu" onclick="event.stopPropagation()">
      ${ALL_LABELS.length?ALL_LABELS.map(l=>`
        <label class="filter-menu-item">
          <input type="checkbox" ${state.labelFilter.includes(l)?'checked':''} onchange="toggleLabelFilter('${l.replace(/'/g,"\\'")}')">
          ${l}
        </label>`).join(''):'<div class="filter-menu-empty">Chưa có nhãn nào trong Workspace</div>'}
      ${count?`<div class="filter-menu-footer"><button class="filter-clear" onclick="clearLabelFilterOnly()">Xoá bộ lọc nhãn</button></div>`:''}
    </div>`:''}
  </div>`;
}
function clearLabelFilterOnly(){ state.labelFilter=[]; state.labelFilterOpen=false; render(); }

/* ---------- tag chips (row/card display) ---------- */
function renderTagList(kb, max){
  const labels = kb.labels||[];
  const shown = max ? labels.slice(0,max) : labels;
  const rest = labels.length - shown.length;
  return `<div class="tag-list">
    ${shown.map(l=>`<span class="tag-chip">${l}</span>`).join('')}
    ${rest>0?`<span class="tag-more">+${rest}</span>`:''}
    <button class="tag-add-btn" onclick="event.stopPropagation();openLabelModal('${kb.id}')" title="Thêm nhãn">${svg('plus')}</button>
  </div>`;
}

/* ---------- sửa tên/mô tả KB (tái sử dụng modal Tạo KB) ---------- */
function openEditKbModal(kbId){
  state.modal='new-kb';
  state.modalKbId=kbId;
  render();
}
function saveKbNameDesc(){
  const kb = state.modalKbId ? KBS.find(k=>k.id===state.modalKbId) : null;
  const name = document.getElementById('kb-name').value.trim();
  const desc = document.getElementById('kb-desc').value.trim();
  if(!name){ showToast('Tên không được để trống'); return; }
  if(name.length>120){ showToast('Tên tối đa 120 ký tự'); return; }
  const dup = KBS.some(other=>other.id!==kb.id && !other.trashed && other.name.toLowerCase()===name.toLowerCase());
  if(dup){ showToast('Tên đã tồn tại trong Workspace'); return; }
  if(desc.length>500){ showToast('Mô tả tối đa 500 ký tự'); return; }
  kb.name = name;
  kb.desc = desc || 'Không có mô tả';
  closeModal();
  showToast('Đã cập nhật Knowledge Base');
}

/* ---------- label modal ("+ Thêm nhãn") ---------- */
function openLabelModal(kbId){
  const kb = KBS.find(k=>k.id===kbId);
  if(!kb) return;
  state.modal='labels';
  state.modalKbId=kbId;
  state.labelDraft=[...(kb.labels||[])];
  state.labelQuery='';
  render();
}
function addLabelToDraft(label, isNew){
  if(!state.labelDraft.some(l=>l.toLowerCase()===label.toLowerCase())) state.labelDraft.push(label);
  if(isNew && !ALL_LABELS.some(l=>l.toLowerCase()===label.toLowerCase())) ALL_LABELS.push(label);
  state.labelQuery='';
  render();
}
function removeLabelFromDraft(label){
  state.labelDraft = state.labelDraft.filter(l=>l!==label);
  render();
}
function onLabelComboKeydown(e){
  if(e.key!=='Enter') return;
  e.preventDefault();
  const q = state.labelQuery.trim();
  if(!q) return;
  const existing = ALL_LABELS.find(l=>l.toLowerCase()===q.toLowerCase());
  addLabelToDraft(existing || q, !existing);
}
function commitLabels(kbId){
  const kb = KBS.find(k=>k.id===kbId);
  if(kb) kb.labels = [...state.labelDraft];
  closeModal();
  showToast('Đã cập nhật nhãn');
}
function renderLabelModalBody(kb){
  const q = state.labelQuery.trim().toLowerCase();
  const suggestions = ALL_LABELS.filter(l=>!state.labelDraft.some(d=>d.toLowerCase()===l.toLowerCase()) && (!q || l.toLowerCase().includes(q)));
  const exactMatch = ALL_LABELS.some(l=>l.toLowerCase()===q);
  const canCreate = q && !exactMatch;
  return `
    <h2>Nhãn cho "${kb.name}"</h2>
    <p class="sub">Nhãn dùng chung cho toàn Workspace — tạo nhãn mới ở đây sẽ xuất hiện làm gợi ý khi gắn nhãn cho KB khác.</p>
    <div class="label-combo">
      <input type="text" placeholder="Tìm hoặc tạo nhãn mới..." value="${state.labelQuery.replace(/"/g,'&quot;')}" oninput="state.labelQuery=this.value;render()" onkeydown="onLabelComboKeydown(event)" autofocus>
      <div class="label-suggest">
        ${suggestions.map(l=>`<div class="label-suggest-item" onclick="addLabelToDraft('${l.replace(/'/g,"\\'")}')">${l}</div>`).join('')}
        ${canCreate?`<div class="label-suggest-item create" onclick="addLabelToDraft('${state.labelQuery.trim().replace(/'/g,"\\'")}', true)">+ Tạo nhãn mới: "${state.labelQuery.trim()}"</div>`:''}
        ${(!suggestions.length && !canCreate)?`<div class="label-suggest-empty">${q?'Không tìm thấy nhãn khớp':'Không còn nhãn nào khác trong Workspace'}</div>`:''}
      </div>
    </div>
    <div class="label-chips-area">
      ${state.labelDraft.length?state.labelDraft.map(l=>`<span class="tag-chip removable">${l}<button onclick="removeLabelFromDraft('${l.replace(/'/g,"\\'")}')" title="Bỏ nhãn">${svg('x')}</button></span>`).join(''):'<span class="label-suggest-empty">Chưa gắn nhãn nào</span>'}
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Huỷ</button>
      <button class="btn btn-primary" onclick="commitLabels('${kb.id}')">Xong</button>
    </div>`;
}

function documentSimilarity(doc, docs){
  const stem = doc.name.toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/g,' ');
  const match = docs.find(other=>other!==doc && other.name.toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/g,' ').split(' ').some(word=>word.length>4 && stem.includes(word)));
  return match ? {score:0.82, with:match.name} : null;
}

function processDocument(kbId, docIndex){
  const kb = KBS.find(k=>k.id===kbId);
  const doc = kb.draft.docs[docIndex];
  if(!doc) return;
  doc.status='Đang xử lý'; render();
  setTimeout(()=>{
    doc.status='Đã xử lý';
    doc.chunks=Math.max(4, Math.ceil((parseFloat(doc.size)||4)*3));
    doc.similarity=documentSimilarity(doc,kb.draft.docs);
    doc.updated=new Date().toLocaleString('vi-VN');
    render();
  },450);
}

function processDocuments(kbId){
  const kb = KBS.find(k=>k.id===kbId);
  kb.draft.docs.forEach((doc,index)=>{
    if(doc.status==='Đang xử lý' || doc.status==='Lỗi') processDocument(kbId,index);
  });
}

function editDocument(kbId, docIndex){
  const kb = KBS.find(k=>k.id===kbId);
  const doc = kb.draft.docs[docIndex];
  const note = window.prompt('Ghi chú chỉnh sửa thủ công cho tài liệu:', doc.manualNote||'');
  if(note===null) return;
  doc.manualNote=note.trim();
  doc.status='Đã xử lý';
  doc.chunks=doc.chunks||Math.max(4, Math.ceil((parseFloat(doc.size)||4)*3));
  doc.updated=new Date().toLocaleString('vi-VN');
  render();
}

function reprocessDocument(kbId, docIndex){
  const kb = KBS.find(k=>k.id===kbId);
  const doc = kb.draft.docs[docIndex];
  if(!doc || !window.confirm('Xử lý lại toàn bộ file sẽ ghi đè chỉnh sửa thủ công hiện có. Bạn có muốn tiếp tục?')) return;
  doc.manualNote='';
  processDocument(kbId,docIndex);
}

function diffDraftPublished(kb){
  const draftNames = kb.draft.docs.map(d=>d.name);
  const publishedNames = kb.published ? kb.published.docs.map(d=>d.name) : [];
  const added = draftNames.filter(n=>!publishedNames.includes(n));
  const removed = publishedNames.filter(n=>!draftNames.includes(n));
  const unchanged = draftNames.filter(n=>publishedNames.includes(n));
  return {added, removed, unchanged};
}

let lastComposerSessionId = null;
function render(){
  renderNav();
  const v=document.getElementById('view');
  if(state.route==='chat'){
    const activeSession = getActiveSession();
    const sameSession = activeSession && activeSession.id===lastComposerSessionId;
    const prevStream = document.getElementById('chat-stream');
    const prevScrollTop = prevStream ? prevStream.scrollTop : null;
    const prevComposer = document.getElementById('composer-input');
    const prevComposerVal = (sameSession && prevComposer) ? prevComposer.value : '';
    const prevComposerSel = prevComposer ? prevComposer.selectionStart : null;
    const hadFocus = document.activeElement === prevComposer;
    v.innerHTML = viewChat();
    const stream = document.getElementById('chat-stream');
    if(stream){
      if(state.chatShouldScroll){
        stream.scrollTop = stream.scrollHeight;
        state.chatShouldScroll = false;
      } else if(prevScrollTop !== null){
        stream.scrollTop = prevScrollTop;
      }
    }
    const ta = document.getElementById('composer-input');
    if(ta && prevComposerVal){
      ta.value = prevComposerVal;
      onComposerInput(ta);
      if(hadFocus){ ta.focus(); if(prevComposerSel!=null) ta.setSelectionRange(prevComposerSel, prevComposerSel); }
    }
    if(state.chatOpenCitation) positionCitationPopover();
    lastComposerSessionId = activeSession && activeSession.id;
  }
  else if(state.route==='knowledge') v.innerHTML = state.kbId ? viewKnowledgeDetail() : viewKnowledgeList();
  else if(state.route==='knowledge-upload'){ v.innerHTML = viewKnowledgeUpload(); startWizard(); }
  else v.innerHTML = viewPlaceholder();
  renderModal();
}

  document.querySelectorAll('.source-panel').forEach(p=>p.style.display='none');

let kbwFileSeq=0;
function addMockFiles(){
  kbwFileSeq++;
  const mocks = [
    {name:'bao-cao-quy-3.pdf', size:'2.4 MB', bytes:2.4*1024*1024, scanned:true, type:'file', uploadStatus:'success', progress:100},
    {name:'chinh-sach-noi-bo.docx', size:'180 KB', bytes:180*1024, scanned:false, type:'file', uploadStatus:'success', progress:100},
    {name:'tai-lieu-error.pdf', size:'1.1 MB', bytes:1.1*1024*1024, scanned:false, type:'file', uploadStatus:'pending', progress:0},
    {name:'du-lieu-khong-ho-tro.zip', size:'3.8 MB', bytes:3.8*1024*1024, scanned:false, type:'file', uploadStatus:'failed', progress:0, retryable:false, errorMessage:'Định dạng .zip không được hỗ trợ trong luồng upload này.'},
  ];
  const f = mocks[(kbwFileSeq-1) % mocks.length];
  const item = {...f, id:kbwFileSeq, ocr:false, retryCount:0, errorMessage:f.errorMessage||''};
  kbwFiles.push(item);
  if(item.uploadStatus==='pending') uploadWizardFile(item.id);
  renderFileList();
}
const KBW_MAX_FILES = 50;
const KBW_MAX_BATCH_SIZE = 500 * 1024 * 1024;
const kbwUploadTimers = new Map();
function uploadWizardFile(id){
  const item = kbwFiles.find(file=>file.id===id);
  if(!item || item.uploadStatus==='success') return;
  if(kbwUploadTimers.has(id)) clearInterval(kbwUploadTimers.get(id));
  item.uploadStatus='uploading';
  item.progress=0;
  item.errorMessage='';
  renderFileList();
  const timer = setInterval(()=>{
    const current = kbwFiles.find(file=>file.id===id);
    if(!current){ clearInterval(timer); kbwUploadTimers.delete(id); return; }
    current.progress=Math.min(100, current.progress+10);
    renderFileList();
    if(current.progress<100) return;
    clearInterval(timer);
    kbwUploadTimers.delete(id);
    const shouldFail = /(^|[-_.])(fail|error|broken)([-_.]|$)/i.test(current.name);
    if(shouldFail){
      current.uploadStatus='failed';
      current.errorMessage='Không thể tải file lên máy chủ. Vui lòng kiểm tra kết nối và thử lại.';
    } else {
      current.uploadStatus='success';
      current.errorMessage='';
    }
    renderFileList();
  }, 120);
}

    const list = kbwConnectedInstances[providerKey];

    opts += `<optgroup label="${kbwProviderLabels[providerKey]}">`;
    opts += list.map(inst=>`<option value="${inst.id}">${inst.label}</option>`).join('');
    opts += `</optgroup>`;
  });
  const hasAny = opts !== '';
  sel.innerHTML = hasAny ? opts : `<option value="">Chưa có connector nào được kết nối</option>`;

function renderFileList(){
  const el = document.getElementById('file-list');
  document.getElementById('added-count').textContent = `${kbwFiles.length}/${KBW_MAX_FILES}`;
  const totalBytes = kbwFiles.reduce((sum, file)=>sum + (file.bytes||0), 0);
  document.getElementById('added-size').textContent = `${(totalBytes/(1024*1024)).toFixed(1)}/${KBW_MAX_BATCH_SIZE/(1024*1024)} MB`;
  if(kbwFiles.length===0){
    el.innerHTML = '<div class="added-list-empty">Chưa có nguồn dữ liệu nào được thêm</div>';
    document.getElementById('s1-next').disabled = true;
    return;
  }
  const now = Date.now();
  el.innerHTML = kbwFiles.map(f => {
    const statusLabel = {pending:'Chờ upload', uploading:'Đang upload', success:'Upload thành công', failed:'Lỗi upload'}[f.uploadStatus] || 'Chờ upload';
    const retryAvailable = f.uploadStatus==='failed' && f.retryable!==false && f.retryCount<3 && (!f.retryAvailableAt || now>=f.retryAvailableAt);
    const retryWaiting = f.uploadStatus==='failed' && f.retryable!==false && f.retryCount<3 && f.retryAvailableAt && now<f.retryAvailableAt;
    const waitSeconds = retryWaiting ? Math.ceil((f.retryAvailableAt-now)/1000) : 0;
    if(retryWaiting) scheduleRetryRefresh(f.retryAvailableAt);
    return `
    <div class="item-wrap">
      <div class="file-row">
        <span class="fname">${f.name}</span>
        <span class="fsize">${f.size}</span>
        <button class="remove" onclick="removeFile(${f.id})">✕</button>
      </div>
      <div class="file-progress-area">
        <div class="file-progress-head">
          <span class="file-status ${f.uploadStatus||'pending'}">${statusLabel}</span>
          <span class="file-progress-value">${f.progress||0}%</span>
        </div>
        <div class="file-progress-track"><div class="file-progress-fill ${f.uploadStatus||'pending'}" style="width:${f.progress||0}%"></div></div>
      </div>
      ${f.uploadStatus==='failed' ? `
      <div class="upload-error">
        <div class="error-copy">${f.errorMessage||'Upload file thất bại.'}
          <span class="retry-info">${f.retryable===false?'File không hợp lệ, cần chọn lại file.':f.retryCount>=3?'Đã hết 3 lần retry.':retryWaiting?`Retry khả dụng sau ${waitSeconds}s.`:`Đã retry ${f.retryCount}/3 lần.`}</span>
        </div>
        ${f.retryable!==false && f.retryCount<3 ? `<button class="retry-btn" ${retryAvailable?'':'disabled'} onclick="retryWizardFile(${f.id})">Retry</button>` : ''}
      </div>` : ''}
    </div>
  `;}).join('');
  document.getElementById('s1-next').disabled = !kbwFiles.some(file=>file.uploadStatus==='success');
}
let kbwRetryTimer = null;
function scheduleRetryRefresh(at){
  if(kbwRetryTimer) return;
  kbwRetryTimer = setTimeout(()=>{ kbwRetryTimer=null; renderFileList(); }, Math.max(100, at-Date.now()));
}
function retryWizardFile(id){
  const file = kbwFiles.find(item=>item.id===id);
  if(!file || file.uploadStatus!=='failed' || file.retryable===false || file.retryCount>=3) return;
  if(file.retryAvailableAt && Date.now()<file.retryAvailableAt) return;
  file.retryCount++;
  file.retryAvailableAt=Date.now()+10000;
  uploadWizardFile(id);
}
function removeFile(id){
  if(kbwUploadTimers.has(id)){
    clearInterval(kbwUploadTimers.get(id));
    kbwUploadTimers.delete(id);
  }
  kbwFiles = kbwFiles.filter(f=>f.id!==id);
  renderFileList();
}

  kbwIndexMode = v;
  document.getElementById('mode-card-hq').classList.toggle('selected', v==='highquality');
  document.getElementById('mode-card-eco').classList.toggle('selected', v==='economical');
}
function stepNumber(id, delta){
  const el = document.getElementById(id);
  el.value = Math.max(16, (parseInt(el.value)||0) + delta);
  resetPreview();
}
function onConfigChange(){ resetPreview(); }
let kbwAllPreviewChunks = [];
function resetPreview(){
  kbwAllPreviewChunks = [];
  document.getElementById('est-chunks-badge').textContent = '0 Estimated Chunks';
  document.getElementById('chunk-list').innerHTML = `
    <div class="preview-empty">
      <div class="preview-empty-icn">
        <svg width="30" height="30" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8.6" cy="8.6" r="5.6"/><path d="M17 17l-4.4-4.4"/><path d="M6.4 8.6h4.4M8.6 6.4v4.4"/></svg>
      </div>
      <div>Bấm nút "Preview Chunk" bên trái để xem thử preview</div>
    </div>`;
}
function runPreviewChunk(){
  const fileName = document.getElementById('preview-file-select').value || 'kb_tai_lieu.md';
  const maxLen = kbwChunkMode==='general'
    ? (parseInt(document.getElementById('general-maxlen').value) || 512)
    : (kbwParentMode==='paragraph' ? (parseInt(document.getElementById('parent-maxlen').value) || 1024) : 99999);

  const charsPerChunk = Math.max(40, maxLen);
  const chunks = [];
  let pos=0, idx=0;
  while(pos < kbwSampleText.length && idx < 8){
    idx++;
    const text = kbwSampleText.slice(pos, pos+charsPerChunk).trim();
    if(!text) break;
    chunks.push({id:idx, text, tokens: Math.round(text.length/3.5)});
    pos += charsPerChunk;
  }
  kbwAllPreviewChunks = chunks;
  document.getElementById('est-chunks-badge').textContent = chunks.length + ' Estimated Chunks';
  document.getElementById('chunk-list').innerHTML = chunks.length ? chunks.map(c=>`
    <div class="chunk">
      <div class="chunk-top">Chunk #${c.id} <span class="chunk-file">· ${c.tokens} tokens · ${fileName}</span></div>
      <div class="chunk-text">"${c.text}..."</div>
    </div>
  `).join('') : '<div class="kb-table-empty">Không tạo được chunk nào</div>';
}

// ---------- step 3 ----------
function startExecution(){
  const stagesDef = ['Parsing','Chunking','Generating Embeddings','Vector DB Stored'];
  const el = document.getElementById('exec-list');
  document.getElementById('kb-ready').classList.remove('show');
  document.getElementById('finish-btn').disabled = true;
  const list = kbwFiles.filter(file=>file.uploadStatus==='success');

  el.innerHTML = list.map((f,i)=>`
    <div class="exec-file" id="exec-${i}">
      <div class="top"><span class="name">${f.name}</span><span class="pct" id="pct-${i}">0%</span></div>
      <div class="stages" id="stages-${i}">${stagesDef.map(s=>`<span>${s}</span>`).join(' — ')}</div>
      <div class="bar-track"><div class="bar-fill" id="bar-${i}"></div></div>
    </div>
  `).join('');

  let doneCount = 0;
  list.forEach((f,i)=>{
    let pct = 0;
    const speed = 4 + Math.random()*3;
    const timer = setInterval(()=>{
      pct += speed;
      if(pct>=100){ pct=100; clearInterval(timer); doneCount++;
        document.getElementById('stages-'+i).innerHTML = stagesDef.map(s=>`<span class="done">${s} ✓</span>`).join(' — ');
        if(doneCount===list.length){
          document.getElementById('kb-ready').classList.add('show');
          document.getElementById('finish-btn').disabled = false;
        }
      } else {
        const stageIdx = Math.min(3, Math.floor(pct/25));
        document.getElementById('stages-'+i).innerHTML = stagesDef.map((s,si)=> si<stageIdx ? `<span class="done">${s} ✓</span>` : si===stageIdx ? `<span>${s} ⟳</span>` : `<span>${s}</span>`).join(' — ');
      }
      document.getElementById('bar-'+i).style.width = pct+'%';
      document.getElementById('pct-'+i).textContent = Math.round(pct)+'%';
    }, 220);
  });
}
function finishWizard(){
  const kb = KBS.find(item=>item.id===state.kbId);
  if(kb){
    const now = new Date().toLocaleString('vi-VN');
    kbwFiles.filter(file=>file.uploadStatus==='success').forEach(file=>kb.draft.docs.push({name:file.name,status:'Đã xử lý',size:file.size||'—',chunks:kbwAllPreviewChunks.length,updated:now}));
    if(kb.published) kb.draft.dirty=true;
  }
  showToast('Đã tạo Knowledge Base thành công');
  exitWizard();
}

// ---------- empty KB modal ----------
function openEmptyModal(){ document.getElementById('empty-modal-overlay').classList.add('show'); }
function closeEmptyModal(){ document.getElementById('empty-modal-overlay').classList.remove('show'); }
function submitEmptyKB(){
  const name = document.getElementById('empty-kb-name').value.trim() || 'Knowledge trống';
  closeEmptyModal();
  document.getElementById('empty-kb-name').value='';
  document.getElementById('empty-kb-desc').value='';
  showToast('Đã tạo Knowledge trống: ' + name);
  exitWizard();
}

render();
</script>
